# Assisted by Claude Code using model(s) Claude Fable 5.1, Claude Opus 5.5
---
- name: "Test cockpit_packages: a list of packages"
  hosts: all
  tasks:
    - name: Tests
      block:
        - name: Include cockpit role
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            cockpit_packages:
              - cockpit-storaged
            __sr_public: true

        - name: Refresh package facts
          ansible.builtin.package_facts:

        - name: Test - the listed and the minimal packages are installed
          ansible.builtin.fail:
            msg: "{{ item }} is not installed"
          when: item not in ansible_facts.packages
          loop:
            - cockpit-storaged
            - cockpit-system
            - cockpit-ws

        # no clear_facts here, so a list kept as a fact by the first run would be reused
        - name: Run the role again without cockpit_packages
          ansible.builtin.include_role:
            name: linux-system-roles.cockpit

        - name: Refresh package facts after the second run
          ansible.builtin.package_facts:

        - name: Test - the second run installs the default set
          ansible.builtin.fail:
            msg: cockpit is not installed, the second run did not use the default set
          when: "'cockpit' not in ansible_facts.packages"

      always:
        - name: Cleanup
          ansible.builtin.include_tasks: tasks/cleanup.yml
